name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hovirix/postgres
  TEST_IMAGE: postgres:test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: |
          set -euo pipefail

          container=postgres-test
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name "$container" \
            -e POSTGRES_PASSWORD=test \
            "$TEST_IMAGE"

          until docker exec "$container" pg_isready -U postgres; do
            sleep 1
          done

          docker exec "$container" postgres --version
          docker exec "$container" pgbackrest version

          docker exec -i "$container" \
            psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE EXTENSION vector;
          CREATE EXTENSION vchord CASCADE;
          CREATE EXTENSION earthdistance;

          SELECT extname, extversion
          FROM pg_extension
          WHERE extname IN ('vector', 'vchord', 'earthdistance')
          ORDER BY extname;
          SQL

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          version=$(docker run --rm --entrypoint postgres "$TEST_IMAGE" --version | awk '{print $3}')
          major=${version%%.*}
          sha=${GITHUB_SHA::7}

          docker tag "$TEST_IMAGE" "$IMAGE:latest"
          docker tag "$TEST_IMAGE" "$IMAGE:$major"
          docker tag "$TEST_IMAGE" "$IMAGE:$version"
          docker tag "$TEST_IMAGE" "$IMAGE:sha-$sha"

          docker push --all-tags "$IMAGE"
