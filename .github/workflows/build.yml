name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hovirix/postgres
  TEST_IMAGE: postgres:test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: |
          set -euo pipefail

          container=postgres-smoke
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name "$container" \
            -e POSTGRES_PASSWORD=smoke-test \
            "$TEST_IMAGE" \
            -c shared_preload_libraries=vchord.so

          for attempt in {1..60}; do
            if docker exec "$container" pg_isready -U postgres -d postgres; then
              break
            fi

            if (( attempt == 60 )); then
              docker logs "$container"
              exit 1
            fi

            sleep 1
          done

          docker exec "$container" postgres --version
          docker exec "$container" pgbackrest version

          docker exec -i "$container" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE EXTENSION vector;
          CREATE EXTENSION vchord CASCADE;
          CREATE EXTENSION earthdistance CASCADE;

          SELECT extname, extversion
          FROM pg_extension
          WHERE extname IN ('vector', 'vchord', 'earthdistance')
          ORDER BY extname;

          SELECT '[1,2,3]'::vector;
          SQL

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          version=$(docker run --rm --entrypoint postgres "$TEST_IMAGE" --version | awk '{print $3}')
          major=${version%%.*}
          sha=${GITHUB_SHA::7}

          docker tag "$TEST_IMAGE" "$IMAGE:latest"
          docker tag "$TEST_IMAGE" "$IMAGE:$major"
          docker tag "$TEST_IMAGE" "$IMAGE:$version"
          docker tag "$TEST_IMAGE" "$IMAGE:sha-$sha"

          docker push --all-tags "$IMAGE"
